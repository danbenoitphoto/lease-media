name: Rename video
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename tour.mp4
        run: |
          if [ -f tour.mp4 ]; then
            git config user.name "danbenoitphoto"
            git config user.email "danbenoitphoto@users.noreply.github.com"
            git mv tour.mp4 tour-179-181.mp4
            git commit -m "Rename tour.mp4 to tour-179-181.mp4"
            git push
          fi
